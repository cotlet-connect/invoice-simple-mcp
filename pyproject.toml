[project]
name = "invoice-simple-mcp"
version = "1.1.0"
description = "Connect Invoice Simple to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Invoice Simple API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["invoice simple", "invoice simple api", "invoice simple mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/invoice-simple-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=invoice-simple"
Source = "https://github.com/cotlet-connect/invoice-simple-mcp"

[project.scripts]
invoice-simple-mcp = "invoice_simple_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"invoice_simple_agent.py" = "invoice_simple_agent.py"

[tool.hatch.build.targets.sdist]
include = ["invoice_simple_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
